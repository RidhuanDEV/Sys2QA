# CI stages 1–2 of the Test Strategy (§7), plus the traceability report (IMP-017). Later stages are added with their IMP tasks.
name: ci

on:
  push:
    # main is updated at the end of each gate; work branches are verified on every push.
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm schemas:check
      - run: pnpm fixtures:check
      - run: pnpm deps:check
      - run: pnpm trace:check
      - run: pnpm docs:links

  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  trace:
    # Stage 3 of the Test Strategy (§7): the traceability report from the test results of the main suite and the web
    # UI's browser end-to-end suite. Ubuntu 24.04: Playwright 1.56 does not support Chromium on Ubuntu 26.04
    # (ubuntu-latest); move to ubuntu-latest when Playwright is upgraded.
    name: Traceability and E2E (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm trace
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: traceability
          path: reports/
          if-no-files-found: ignore
