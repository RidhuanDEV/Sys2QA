# CI stages 1–2 of the Test Strategy (§7), plus the traceability report (IMP-017). Later stages are added with their IMP tasks.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm schemas:check
      - run: pnpm fixtures:check
      - run: pnpm deps:check
      - run: pnpm trace:check
      - run: pnpm docs:links

  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == '24') }}
        run: pnpm test
      # One matrix cell also produces the traceability report from its test results (Test Strategy §1).
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
        run: pnpm trace
      - if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
        uses: actions/upload-artifact@v4
        with:
          name: traceability
          path: reports/
          if-no-files-found: ignore
